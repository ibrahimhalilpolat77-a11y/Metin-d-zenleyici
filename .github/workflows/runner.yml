name: Dynamic Encrypted Code Runner

on:
  repository_dispatch:
    types: [run-hidden-code]

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot Beautifulsoup4 urllib3

      - name: Şifreli Kodu Çöz ve Çalıştır
        run: |
          echo "${{ github.event.client_payload.b64_code }}" | base64 -d > "${{ github.event.client_payload.file_name }}"
          python "${{ github.event.client_payload.file_name }}"
